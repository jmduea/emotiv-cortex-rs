name: Publish Dry Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  v2-dry-run:
    name: cargo publish --dry-run (emotiv-cortex-v2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Dry run emotiv-cortex-v2
        run: cargo publish --dry-run -p emotiv-cortex-v2

  tui-binary-preflight:
    name: TUI binary release preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build emotiv-cortex-tui (release, no LSL)
        run: cargo build -p emotiv-cortex-tui --release --no-default-features

      - name: Stash baseline binary
        run: Copy-Item target/release/emotiv-cortex-tui.exe target/release/emotiv-cortex-tui-nolsl.exe

      - name: Build emotiv-cortex-tui (release, with LSL)
        run: cargo build -p emotiv-cortex-tui --release --no-default-features --features lsl

      - name: Stage release asset names
        run: |
          Copy-Item target/release/emotiv-cortex-tui-nolsl.exe emotiv-cortex-tui-x86_64-pc-windows-msvc.exe
          Copy-Item target/release/emotiv-cortex-tui.exe emotiv-cortex-tui-x86_64-pc-windows-msvc-lsl.exe

      - name: Verify staged release assets
        run: |
          Get-Item emotiv-cortex-tui-x86_64-pc-windows-msvc.exe
          Get-Item emotiv-cortex-tui-x86_64-pc-windows-msvc-lsl.exe
