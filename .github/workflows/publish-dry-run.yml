name: Publish Dry Run

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  library-dry-run:
    name: cargo publish --dry-run (neuroclient)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Dry run neuroclient
        run: cargo publish --dry-run -p neuroclient

  tui-binary-preflight:
    name: TUI binary release preflight
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build neuroclient-tui (release, no LSL)
        run: cargo build -p neuroclient-tui --release --no-default-features

      - name: Stash baseline binary
        run: Copy-Item target/release/neuroclient-tui.exe target/release/neuroclient-tui-nolsl.exe

      - name: Build neuroclient-tui (release, with LSL)
        run: cargo build -p neuroclient-tui --release --no-default-features --features lsl

      - name: Stage release asset names
        run: |
          Copy-Item target/release/neuroclient-tui-nolsl.exe neuroclient-tui-x86_64-pc-windows-msvc.exe
          Copy-Item target/release/neuroclient-tui.exe neuroclient-tui-x86_64-pc-windows-msvc-lsl.exe

      - name: Verify staged release assets
        run: |
          Get-Item neuroclient-tui-x86_64-pc-windows-msvc.exe
          Get-Item neuroclient-tui-x86_64-pc-windows-msvc-lsl.exe
