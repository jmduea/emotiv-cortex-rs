name: Release

on:
  push:
    tags:
      - "v*"

env:
  CARGO_TERM_COLOR: always

jobs:
  validate-release-contract:
    name: Validate release contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Validate tag, crate versions, and TUI exact pin
        shell: bash
        run: |
          set -euo pipefail

          TAG_VERSION="${GITHUB_REF_NAME#v}"
          V2_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/emotiv-cortex-v2/Cargo.toml | head -n1)
          TUI_VERSION=$(sed -n 's/^version = "\(.*\)"/\1/p' crates/emotiv-cortex-tui/Cargo.toml | head -n1)
          TUI_V2_PIN=$(sed -n 's/^emotiv-cortex-v2 = { version = "=\([^"]*\)".*$/\1/p' crates/emotiv-cortex-tui/Cargo.toml | head -n1)

          if [[ -z "$TAG_VERSION" || -z "$V2_VERSION" || -z "$TUI_VERSION" || -z "$TUI_V2_PIN" ]]; then
            echo "Failed to parse the full release contract."
            echo "tag=$TAG_VERSION"
            echo "emotiv-cortex-v2 version=$V2_VERSION"
            echo "emotiv-cortex-tui version=$TUI_VERSION"
            echo "emotiv-cortex-tui -> emotiv-cortex-v2 exact pin=$TUI_V2_PIN"
            exit 1
          fi

          if [[ "$TAG_VERSION" != "$V2_VERSION" || "$TAG_VERSION" != "$TUI_VERSION" || "$TAG_VERSION" != "$TUI_V2_PIN" ]]; then
            echo "Release contract mismatch detected."
            echo "tag=$TAG_VERSION"
            echo "emotiv-cortex-v2 version=$V2_VERSION"
            echo "emotiv-cortex-tui version=$TUI_VERSION"
            echo "emotiv-cortex-tui -> emotiv-cortex-v2 exact pin=$TUI_V2_PIN"
            exit 1
          fi

  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: validate-release-contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Publish emotiv-cortex-v2
        run: cargo publish -p emotiv-cortex-v2
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}

      # TUI is not published to crates.io; Windows binary is attached to the GitHub Release only.

  build-windows:
    name: Build Windows binaries
    runs-on: windows-latest
    needs: validate-release-contract
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Build emotiv-cortex-tui (release, no LSL)
        run: cargo build -p emotiv-cortex-tui --release --no-default-features

      - name: Stash baseline binary
        run: Copy-Item target/release/emotiv-cortex-tui.exe target/release/emotiv-cortex-tui-nolsl.exe

      - name: Build emotiv-cortex-tui (release, with LSL)
        run: cargo build -p emotiv-cortex-tui --release --no-default-features --features lsl

      - name: Upload Windows binaries
        uses: actions/upload-artifact@v4
        with:
          name: emotiv-cortex-tui-windows-x86_64
          path: |
            target/release/emotiv-cortex-tui-nolsl.exe
            target/release/emotiv-cortex-tui.exe

  release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [publish, build-windows]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Download Windows binaries
        uses: actions/download-artifact@v4
        with:
          name: emotiv-cortex-tui-windows-x86_64

      - name: Rename assets for release
        run: |
          mv emotiv-cortex-tui-nolsl.exe emotiv-cortex-tui-x86_64-pc-windows-msvc.exe
          mv emotiv-cortex-tui.exe emotiv-cortex-tui-x86_64-pc-windows-msvc-lsl.exe

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            emotiv-cortex-tui-x86_64-pc-windows-msvc.exe
            emotiv-cortex-tui-x86_64-pc-windows-msvc-lsl.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
