name: Quality Ratchet

on:
    schedule:
        - cron: "0 4 * * 1"
    workflow_dispatch:

# The ratchet PR touches only ci/quality-thresholds.env — never workflow
# files — so the default GITHUB_TOKEN permissions below are sufficient.
permissions:
    contents: write
    pull-requests: write

jobs:
    ratchet:
        name: Tighten quality thresholds
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v4

            - uses: dtolnay/rust-toolchain@stable

            - uses: taiki-e/install-action@cargo-llvm-cov

            - uses: Swatinem/rust-cache@v2

            - name: Compute fresh coverage baseline
              id: baselines
              env:
                  EMOTIV_SKIP_LIVE_TESTS: "1"
              shell: bash
              run: |
                  set -euo pipefail

                  current_cov=$(grep -E '^COVERAGE_MIN_LINES=' ci/quality-thresholds.env | cut -d= -f2)
                  if ! [[ "$current_cov" =~ ^[0-9]+$ ]]; then
                    echo "Failed to parse COVERAGE_MIN_LINES from ci/quality-thresholds.env"
                    exit 1
                  fi

                  # Extract line coverage from the structured JSON summary
                  # rather than parsing positional text columns.
                  cargo llvm-cov --workspace --all-targets --json --summary-only > coverage.json
                  measured_cov=$(jq -r '.data[0].totals.lines.percent' coverage.json)
                  measured_cov_floor=$(awk -v v="$measured_cov" 'BEGIN { printf("%d", v) }')

                  # Improvement-only guard: the floor can only ever go up.
                  next_cov=$current_cov
                  if [ "$measured_cov_floor" -gt "$current_cov" ]; then
                    next_cov=$measured_cov_floor
                  fi

                  echo "current=$current_cov measured=$measured_cov next=$next_cov"

                  {
                    echo "current_cov=$current_cov"
                    echo "measured_cov=$measured_cov"
                    echo "next_cov=$next_cov"
                    echo "changed=$([ "$next_cov" != "$current_cov" ] && echo true || echo false)"
                  } >> "$GITHUB_OUTPUT"

            - name: Raise coverage floor in threshold file
              if: steps.baselines.outputs.changed == 'true'
              shell: bash
              run: |
                  set -euo pipefail

                  next_cov='${{ steps.baselines.outputs.next_cov }}'
                  current_cov='${{ steps.baselines.outputs.current_cov }}'

                  # Defense in depth: refuse to lower the floor even if the
                  # computation above ever regresses.
                  if [ "$next_cov" -le "$current_cov" ]; then
                    echo "Refusing to lower or repeat the coverage floor ($current_cov -> $next_cov)"
                    exit 1
                  fi

                  sed -i -E "s/^COVERAGE_MIN_LINES=[0-9]+/COVERAGE_MIN_LINES=$next_cov/" ci/quality-thresholds.env

                  # The ratchet must only ever touch the threshold file.
                  changed_files=$(git diff --name-only)
                  if [ "$changed_files" != "ci/quality-thresholds.env" ]; then
                    echo "Unexpected files modified by ratchet: $changed_files"
                    exit 1
                  fi

                  echo "Ratchet updated: COVERAGE_MIN_LINES $current_cov -> $next_cov"

            - name: Create pull request for ratchet update
              if: steps.baselines.outputs.changed == 'true'
              uses: peter-evans/create-pull-request@v6
              with:
                  branch: ci/quality-ratchet
                  title: "ci: raise coverage floor"
                  commit-message: "ci: raise coverage floor"
                  body: |
                      Automated quality ratchet update.

                      - `COVERAGE_MIN_LINES`: `${{ steps.baselines.outputs.current_cov }}` -> `${{ steps.baselines.outputs.next_cov }}`

                      Measured workspace line coverage this run: `${{ steps.baselines.outputs.measured_cov }}%`.

                      Clippy is not ratcheted: CI already denies all clippy warnings.
                  labels: |
                      ci
                      technical-debt
                  add-paths: |
                      ci/quality-thresholds.env

            - name: No ratchet change needed
              if: steps.baselines.outputs.changed != 'true'
              run: echo "Coverage floor unchanged (${{ steps.baselines.outputs.current_cov }}%); no PR created."
