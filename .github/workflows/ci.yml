name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  quality:
    name: Quality Gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Rustfmt check
        run: cargo fmt --all --check

      - name: Clippy gate (library rustls, zero warnings)
        run: >
          cargo clippy -p neuroclient --lib
          --no-default-features --features rustls-tls,config-toml
          -- -D warnings
          -D clippy::unwrap_used -D clippy::expect_used
          -D clippy::panic -D clippy::todo -D clippy::unimplemented

      - name: Clippy gate (TUI no default features, zero warnings)
        run: >
          cargo clippy -p neuroclient-tui --bin neuroclient-tui
          --no-default-features
          -- -D warnings
          -D clippy::unwrap_used -D clippy::expect_used
          -D clippy::panic -D clippy::todo -D clippy::unimplemented

      - name: Clippy pedantic report (library rustls)
        continue-on-error: true
        run: >
          cargo clippy -p neuroclient --lib
          --no-default-features --features rustls-tls,config-toml
          -- -W clippy::pedantic

      - name: Clippy pedantic report (TUI no default features)
        continue-on-error: true
        run: >
          cargo clippy -p neuroclient-tui --bin neuroclient-tui
          --no-default-features
          -- -W clippy::pedantic

  coverage:
    name: Coverage Gate (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@cargo-llvm-cov
      - uses: Swatinem/rust-cache@v2

      - name: Load quality thresholds
        run: grep -E '^[A-Z_]+=' ci/quality-thresholds.env >> "$GITHUB_ENV"

      - name: Coverage threshold (workspace line >= budget)
        env:
          EMOTIV_SKIP_LIVE_TESTS: "1"
        shell: bash
        run: |
          set -euo pipefail
          cargo llvm-cov --workspace --all-targets \
            --lcov --output-path lcov.info \
            --fail-under-lines "${COVERAGE_MIN_LINES}" | tee coverage.txt

      - name: Coverage gate summary
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "## Coverage Gate"
            echo ""
            echo "- Threshold: line coverage >= ${COVERAGE_MIN_LINES}%"
            echo "- Result: PASS"
            echo "- Total coverage:"
            grep '^TOTAL' coverage.txt || echo "(TOTAL row not found in output)"
            echo ""
            echo "LCOV report is uploaded as artifact: \`lcov\`."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload coverage artifact
        uses: actions/upload-artifact@v4
        with:
          name: lcov
          path: |
            lcov.info
            coverage.txt

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: lcov.info
          fail_ci_if_error: false

  msrv:
    name: MSRV (library 1.85, TUI 1.88)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.85"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: "1.88"
      - uses: Swatinem/rust-cache@v2

      - name: Check neuroclient on Rust 1.85 (rustls)
        run: >
          cargo +1.85 check -p neuroclient
          --no-default-features --features rustls-tls,config-toml

      - name: Check neuroclient on Rust 1.85 (native-tls)
        run: >
          cargo +1.85 check -p neuroclient
          --no-default-features --features native-tls,config-toml

      - name: Check neuroclient-tui on Rust 1.88
        run: cargo +1.88 check -p neuroclient-tui --no-default-features

  rustls-matrix:
    name: Rustls Matrix (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check neuroclient (rustls)
        run: >
          cargo check -p neuroclient
          --no-default-features --features rustls-tls,config-toml

      - name: Test neuroclient (rustls)
        env:
          EMOTIV_SKIP_LIVE_TESTS: "1"
        run: >
          cargo test -p neuroclient
          --no-default-features --features rustls-tls,config-toml

      - name: Check TUI (no default features)
        run: cargo check -p neuroclient-tui --no-default-features

      - name: Test TUI (no default features)
        run: cargo test -p neuroclient-tui --no-default-features

  native-tls:
    name: Native TLS (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check neuroclient (native-tls)
        run: >
          cargo check -p neuroclient
          --no-default-features --features native-tls,config-toml

      - name: Test neuroclient (native-tls)
        env:
          EMOTIV_SKIP_LIVE_TESTS: "1"
        run: >
          cargo test -p neuroclient
          --no-default-features --features native-tls,config-toml

  docs:
    name: Docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Test neuroclient docs
        run: >
          cargo test -p neuroclient --doc
          --no-default-features --features rustls-tls,config-toml

      - name: Verify no ignored rustdoc examples in neuroclient src
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n '```ignore' crates/neuroclient/src; then
            echo "Found rustdoc examples marked as ignore in crates/neuroclient/src."
            exit 1
          fi

      - name: Verify no ignored rustdoc examples in neuroclient-tui src
        shell: bash
        run: |
          set -euo pipefail
          if grep -R -n '```ignore' crates/neuroclient-tui/src; then
            echo "Found rustdoc examples marked as ignore in crates/neuroclient-tui/src."
            exit 1
          fi

      - name: Build neuroclient rustdoc with warnings denied
        run: >
          cargo rustdoc -p neuroclient
          --no-default-features --features rustls-tls,config-toml
          -- -D warnings

      - name: Build neuroclient-tui rustdoc with warnings denied
        run: >
          cargo rustdoc -p neuroclient-tui
          --no-default-features
          -- -D warnings

      - name: Documentation gates summary
        if: ${{ success() }}
        shell: bash
        run: |
          {
            echo "## Documentation Gates"
            echo ""
            echo "- \`neuroclient\` doctests: PASS"
            echo "- \`neuroclient\` rustdoc warnings denied: PASS"
            echo "- \`neuroclient-tui\` rustdoc warnings denied: PASS"
            echo "- rustdoc \`ignore\` snippet scan (both crates): PASS"
          } >> "$GITHUB_STEP_SUMMARY"

  lsl-windows:
    name: Check TUI LSL (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Check TUI (LSL feature)
        run: cargo check -p neuroclient-tui --no-default-features --features lsl

      - name: Test TUI (LSL feature)
        run: cargo test -p neuroclient-tui --no-default-features --features lsl

  package:
    name: Package
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Package neuroclient
        run: cargo package -p neuroclient --allow-dirty

      - name: Package neuroclient-tui (manifest/list check)
        run: cargo package -p neuroclient-tui --allow-dirty --list
