minimum_pre_commit_version: "3.7.0"
default_install_hook_types:
  - pre-commit
  - pre-push

repos:
  - repo: local
    hooks:
      - id: rustfmt-check
        name: rustfmt check
        entry: cargo fmt --all --check
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: clippy-library-strict
        name: clippy strict (neuroclient)
        entry: >
          cargo clippy -p neuroclient --lib
          --no-default-features --features rustls-tls,config-toml
          -- -D warnings
          -D clippy::unwrap_used -D clippy::expect_used
          -D clippy::panic -D clippy::todo -D clippy::unimplemented
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: clippy-cli-strict
        name: clippy strict (neuroclient-tui)
        entry: >
          cargo clippy -p neuroclient-tui --bin neuroclient-tui
          --no-default-features
          -- -D warnings
          -D clippy::unwrap_used -D clippy::expect_used
          -D clippy::panic -D clippy::todo -D clippy::unimplemented
        language: system
        pass_filenames: false
        stages: [pre-commit]

      - id: tests-rustls
        name: tests (rustls matrix baseline)
        entry: >
          cargo test -p neuroclient
          --no-default-features --features rustls-tls,config-toml
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: doctest-library
        name: doctest (neuroclient)
        entry: >
          cargo test -p neuroclient --doc
          --no-default-features --features rustls-tls,config-toml
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: rustdoc-library-deny-warnings
        name: rustdoc warnings denied (neuroclient)
        entry: >
          cargo rustdoc -p neuroclient
          --no-default-features --features rustls-tls,config-toml
          -- -D warnings
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: rustdoc-cli-deny-warnings
        name: rustdoc warnings denied (neuroclient-tui)
        entry: >
          cargo rustdoc -p neuroclient-tui
          --no-default-features
          -- -D warnings
        language: system
        pass_filenames: false
        stages: [pre-push]

      - id: coverage-gate
        name: coverage gate (workspace threshold file)
        entry: >
          bash -c 'set -a; . ci/quality-thresholds.env; set +a;
          exec cargo llvm-cov --workspace --all-targets
          --summary-only --fail-under-lines "$COVERAGE_MIN_LINES"'
        language: system
        pass_filenames: false
        stages: [pre-push]
