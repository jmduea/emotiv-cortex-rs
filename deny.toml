[graph]
all-features = true
targets = [
    "x86_64-unknown-linux-gnu",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
    "x86_64-pc-windows-msvc",
]

[advisories]
# Vulnerability advisories are errors by default (cargo-deny v2 schema).
unmaintained = "workspace"
unsound = "all"
yanked = "deny"
# Any exception added to `ignore` must reference exactly one advisory ID and
# carry a comment with: rationale, owner, and expiry date (YYYY-MM-DD).
ignore = []

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"

[licenses]
confidence-threshold = 0.93
allow = [
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "MIT",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    # CA certificate bundle data shipped by webpki-roots (Mozilla trust store).
    "CDLA-Permissive-2.0",
]
